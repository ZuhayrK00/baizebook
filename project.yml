name: BaizeBook
options:
  bundleIdPrefix: com.zuhayrk
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 7NW33277C8
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '6'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BaizeBook:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zuhayrk.baizebook
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BaizeBook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Snooker game data
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        'UISupportedInterfaceOrientations~ipad': [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: BaizeBookWatch
  BaizeBookWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      - path: Resources/WatchAssets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zuhayrk.baizebook.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        SKIP_INSTALL: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: BaizeBook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zuhayrk.baizebook
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
  BaizeBookTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: BaizeBook}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BaizeBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: BaizeBook}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BaizeBook:
    build:
      targets:
        BaizeBook: all
    test:
      targets: [BaizeBookTests, BaizeBookUITests]
    archive:
      config: Release
  BaizeBookWatch:
    build:
      targets:
        BaizeBookWatch: all
